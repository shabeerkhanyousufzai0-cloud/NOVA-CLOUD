
services:
  db:
    image: mariadb:11.4
    container_name: nova-moodle-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  moodle:
    image: oksigenia/moodle:5.3
    container_name: nova-moodle
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      MOODLE_URL: http://localhost:8080
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_ADMIN_EMAIL: admin@novacloud.local
      MOODLE_SITE_NAME: NOVA CLOUD LMS
      MOODLE_SITE_SHORTNAME: NOVA
    volumes:
      - moodle_code:/var/www/moodle
      - moodle_data:/var/www/moodledata

volumes:
  db_data:
  moodle_code:
  moodle_data:
